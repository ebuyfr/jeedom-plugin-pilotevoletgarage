<!-- Widget "garageDoor" — volet roulant animé côté navigateur.
     Le tablier s'enroule vers le haut (le bord bas remonte) et il reste une barre
     (le coffre) au-dessus du cadre. Reçoit la CIBLE (0=fermé / 100=ouvert) pendant
     un mouvement et anime à la vitesse du temps de course (#travel#, secondes).
     Style d'enroulement via #rollgrow# ('1' = coffre qui grossit). -->
<div class="cmd cmd-widget #history# #displayHistory#" data-type="info" data-subtype="numeric" data-template="garageDoor" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" title="#collectDate#">
  <div class="title #hide_name#">
    <div class="cmdName" style="font-weight:bold;">#name_display#</div>
  </div>
  <div style="text-align:center;padding-top:4px;">
    <svg class="gd-svg" viewBox="0 0 120 112" width="96" height="90" style="width:#largeur#;height:#hauteur#;max-width:100%;overflow:visible;" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="gd-clip-#uid#"><rect class="gd-clip-rect" x="22" y="18" width="76" height="74"/></clipPath>
        <linearGradient id="gd-door-#uid#" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c2c9d3"/><stop offset="1" stop-color="#9aa3af"/>
        </linearGradient>
      </defs>
      <!-- intérieur sombre -->
      <rect x="22" y="18" width="76" height="74" fill="#2b2f36"/>
      <rect x="30" y="60" width="60" height="32" fill="#22262c"/>
      <!-- tablier : rect complet, révélé du haut selon la hauteur du clip -->
      <g clip-path="url(#gd-clip-#uid#)">
        <rect x="22" y="18" width="76" height="74" fill="url(#gd-door-#uid#)"/>
        <g stroke="#7f8894" stroke-width="1.4">
          <line x1="22" y1="30" x2="98" y2="30"/><line x1="22" y1="42" x2="98" y2="42"/>
          <line x1="22" y1="54" x2="98" y2="54"/><line x1="22" y1="66" x2="98" y2="66"/>
          <line x1="22" y1="78" x2="98" y2="78"/><line x1="22" y1="90" x2="98" y2="90"/>
        </g>
      </g>
      <!-- cadre : montants + linteau + sol -->
      <g fill="none" stroke="#5b6470" stroke-width="4" stroke-linecap="round">
        <line x1="20" y1="16" x2="20" y2="94"/><line x1="100" y1="16" x2="100" y2="94"/>
        <line x1="16" y1="16" x2="104" y2="16"/>
      </g>
      <line x1="8" y1="94" x2="112" y2="94" stroke="#4a525d" stroke-width="4" stroke-linecap="round"/>
      <!-- coffre / enroulement, au-dessus du cadre -->
      <rect class="gd-roll" x="18" y="7" width="84" height="8" rx="4" fill="#aab2bd" stroke="#7f8894" stroke-width="1"/>
    </svg>
    <div class="gd-state" style="font-weight:bold;margin-top:2px;"></div>
    <div class="gd-pct" style="font-size:12px;opacity:.75;#hidePercent#"></div>
    <div class="gd-dur" style="font-size:11px;opacity:.6;display:none;"></div>
    <div class="gd-cd" style="font-size:11px;opacity:.8;display:none;"></div>
  </div>
  <div class="timeCmd label label-default #history#" data-type="info"></div>
  <template>
    <div>hauteur : 90px ({{Hauteur de l'illustration}})</div>
    <div>largeur : 90px ({{Largeur de l'illustration}})</div>
    <div>travel : 18 ({{Temps de course complet en secondes}})</div>
    <div>rollgrow : 1 ({{Coffre d'enroulement qui grossit}})</div>
    <div>hidePercent : display:none ({{Masquer le pourcentage}})</div>
  </template>
  <script>
    (function () {
      var UID = '#uid#';
      var TRAVEL = parseFloat('#travel#'); if (isNaN(TRAVEL) || TRAVEL <= 0) { TRAVEL = 18; }
      var GROW = ('#rollgrow#' === '1');
      var rendered = null, raf = null;
      var SHOWDUR = ('#showdur#' === '1'), SHOWCD = ('#showcd#' === '1');
      var AUTOCLOSE = parseFloat('#autoclose#'); if (isNaN(AUTOCLOSE)) { AUTOCLOSE = 0; }
      // Origine : date de dernière valeur de la commande État (fallback = maintenant).
      function toSec(s) { var d = new Date(String(s || '').replace(' ', 'T')).getTime() / 1000; return isNaN(d) ? (Date.now() / 1000) : d; }
      var SS0 = toSec('#valueDate#');
      var lastLabel = null, stateSince = SS0, closeAt = 0;

      function el() { return document.querySelector('.cmd[data-cmd_uid="' + UID + '"]'); }
      function setDoor(root, v) {
        var ch = (1 - v / 100) * 74;                 // hauteur visible du tablier
        var clip = root.querySelector('.gd-clip-rect');
        if (clip) { clip.setAttribute('height', ch.toFixed(2)); }
        if (GROW) {                                  // coffre qui grossit avec l'ouverture
          var bh = 5 + (v / 100) * 9;
          var roll = root.querySelector('.gd-roll');
          if (roll) { roll.setAttribute('height', bh.toFixed(2)); roll.setAttribute('y', (15 - bh).toFixed(2)); roll.setAttribute('rx', (bh / 2).toFixed(2)); }
        }
        var p = root.querySelector('.gd-pct'); if (p) { p.textContent = Math.round(v) + '%'; }
      }
      function staticLabel(v) { return (v <= 0) ? 'Fermé' : (v >= 100 ? 'Ouvert' : 'Arrêté ' + Math.round(v) + '%'); }
      function setLabel(root, txt, sinceTs) {
        var s = root.querySelector('.gd-state'); if (s) { s.textContent = txt; }
        if (txt !== lastLabel) {
          // Ancre sur le temps SERVEUR (valueDate) quand il est fourni, pas sur
          // l'instant de réception : en accès distant l'événement arrive en retard,
          // mais « Depuis… » et le compte à rebours restent exacts. Sinon : premier
          // libellé = date de la commande État (SS0), changements suivants = maintenant.
          stateSince = (typeof sinceTs === 'number' && !isNaN(sinceTs)) ? sinceTs
                     : ((lastLabel === null) ? SS0 : (Date.now() / 1000));
          lastLabel = txt;
          closeAt = (txt === 'Ouvert' && AUTOCLOSE > 0) ? (stateSince + AUTOCLOSE) : 0;
        }
      }

      function animateTo(root, target, durationMs, movingLabel, endLabel, anchorTs) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        var startVal = (rendered === null) ? target : rendered;
        var startT = null, dur = Math.max(1, durationMs);
        // anchorTs = instant SERVEUR du début de mouvement ; l'état final est atteint
        // dur ms plus tard. Sert d'ancre exacte aux affichages de temps (indépendant
        // du retard de réception en accès distant).
        var hasAnchor = (typeof anchorTs === 'number' && !isNaN(anchorTs));
        if (movingLabel) { setLabel(root, movingLabel, hasAnchor ? anchorTs : undefined); }
        function step(now) {
          if (startT === null) { startT = now; }
          var t = Math.min(1, (now - startT) / dur);
          rendered = startVal + (target - startVal) * t;
          setDoor(root, rendered);
          if (t < 1) { raf = requestAnimationFrame(step); }
          else { rendered = target; setDoor(root, target); setLabel(root, endLabel, hasAnchor ? (anchorTs + dur / 1000) : undefined); raf = null; }
        }
        raf = requestAnimationFrame(step);
      }

      jeedom.cmd.addUpdateFunction('#id#', function (_options) {
        var root = el(); if (root === null) { return; }
        var v = parseFloat(_options.value); if (isNaN(v)) { v = 0; }
        if (v < 0) { v = 0; } if (v > 100) { v = 100; }
        var vd = toSec(_options.valueDate);   // horodatage serveur de cette valeur
        if (rendered === null) { rendered = v; setDoor(root, v); setLabel(root, staticLabel(v), vd); return; }
        if ((v === 0 || v === 100) && Math.round(rendered) !== v) {
          var durMs = Math.abs(v - rendered) / 100 * TRAVEL * 1000;
          animateTo(root, v, durMs, (v === 0 ? 'Fermeture…' : 'Ouverture…'), (v === 0 ? 'Fermé' : 'Ouvert'), vd);
        } else {
          animateTo(root, v, 400, null, staticLabel(v), vd);
        }
      });

      // --- Affichages de temps (durée d'état + compte à rebours) ------
      function fmt(sec) {
        sec = Math.max(0, Math.floor(sec));
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60, o = '';
        if (h > 0) { o += h + 'h'; }
        if (h > 0 || m > 0) { o += (h > 0 && m < 10 ? '0' : '') + m + 'm'; }
        o += ((h > 0 || m > 0) && s < 10 ? '0' : '') + s + 's';
        return o;
      }
      function tick() {
        var root = el(); if (root === null) { return; }
        var now = Date.now() / 1000;
        var dur = root.querySelector('.gd-dur'), cd = root.querySelector('.gd-cd');
        if (dur) {
          if (SHOWDUR && stateSince > 0) { dur.style.display = ''; dur.textContent = 'Depuis ' + fmt(now - stateSince); }
          else { dur.style.display = 'none'; }
        }
        if (cd) {
          if (SHOWCD && closeAt > now) { cd.style.display = ''; cd.textContent = 'Fermeture dans ' + fmt(closeAt - now); }
          else { cd.style.display = 'none'; }
        }
      }
      if (SHOWDUR || SHOWCD) { setInterval(tick, 1000); }
      try {
        if (el() !== null) {
          jeedom.cmd.refreshValue([{ cmd_id: '#id#', value: '#value#', display_value: '#state#', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '#unite#' }]);
        }
      } catch (e) {}
    })();
  </script>
</div>
