<!-- Widget "garageDoor" (mobile) — porte de garage sectionnelle animée (0 = fermé, 100 = ouvert) -->
<div class="cmd cmd-widget #history# #displayHistory#" data-type="info" data-subtype="numeric" data-template="garageDoor" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" title="#collectDate#">
  <div class="title #hide_name#">
    <div class="cmdName" style="font-weight:bold;">#name_display#</div>
  </div>
  <div style="text-align:center;padding-top:4px;">
    <svg class="gd-svg" viewBox="0 0 120 112" width="84" height="80" style="width:#largeur#;height:#hauteur#;max-width:100%;overflow:visible;" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="gd-clip-#uid#"><rect x="22" y="18" width="76" height="74"/></clipPath>
        <linearGradient id="gd-door-#uid#" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b9c0ca"/><stop offset="1" stop-color="#98a1ad"/>
        </linearGradient>
      </defs>
      <rect x="22" y="18" width="76" height="74" fill="#2b2f36"/>
      <rect x="30" y="60" width="60" height="32" fill="#22262c"/>
      <g class="gd-door" clip-path="url(#gd-clip-#uid#)">
        <rect x="22" y="18" width="76" height="74" fill="url(#gd-door-#uid#)"/>
        <g stroke="#7f8894" stroke-width="1.4">
          <line x1="22" y1="32" x2="98" y2="32"/><line x1="22" y1="46" x2="98" y2="46"/>
          <line x1="22" y1="60" x2="98" y2="60"/><line x1="22" y1="74" x2="98" y2="74"/>
        </g>
        <rect x="52" y="84" width="16" height="3" rx="1.5" fill="#6b7480"/>
      </g>
      <g fill="none" stroke="#5b6470" stroke-width="4" stroke-linecap="round">
        <line x1="20" y1="16" x2="20" y2="94"/><line x1="100" y1="16" x2="100" y2="94"/>
        <line x1="16" y1="16" x2="104" y2="16"/>
      </g>
      <line x1="8" y1="94" x2="112" y2="94" stroke="#4a525d" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="gd-state" style="font-weight:bold;margin-top:2px;"></div>
    <div class="gd-pct" style="font-size:12px;opacity:.75;#hidePercent#"></div>
  </div>
  <div class="timeCmd label label-default #history#" data-type="info"></div>
  <template>
    <div>hauteur : 80px ({{Hauteur de l'illustration}})</div>
    <div>largeur : 80px ({{Largeur de l'illustration}})</div>
    <div>hidePercent : display:none ({{Masquer le pourcentage}})</div>
  </template>
  <script>
    (function () {
      var UID = '#uid#';
      jeedom.cmd.addUpdateFunction('#id#', function (_options) {
        var el = document.querySelector('.cmd[data-cmd_uid="' + UID + '"]');
        if (el === null) return;
        var v = parseFloat(_options.value);
        if (isNaN(v)) v = 0;
        if (v < 0) v = 0; if (v > 100) v = 100;
        var H = 74;
        el.querySelector('.gd-door').setAttribute('transform', 'translate(0,' + (-(v / 100) * H) + ')');
        var pct = Math.round(v);
        var st = el.querySelector('.gd-state');
        if (st) st.textContent = (pct <= 0) ? '{{Fermé}}' : (pct >= 100 ? '{{Ouvert}}' : '{{Ouvert}} ' + pct + '%');
        var lbl = el.querySelector('.gd-pct');
        if (lbl) lbl.textContent = pct + '%';
      });
      jeedom.cmd.refreshValue([{ cmd_id: '#id#', value: '#value#', display_value: '#state#', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '#unite#' }]);
    })();
  </script>
</div>
